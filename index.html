<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Project Einstein | 1.0 RC6</title>
  <style>
    :root { color-scheme: dark; background: #06111f; }
    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
      background: #06111f; overscroll-behavior: none;
    }
    #safe-area {
      position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh;
      padding-top: env(safe-area-inset-top, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      background: #06111f;
    }
    #unity-container { position: relative; width: 100%; height: 100%; overflow: hidden; }
    #unity-canvas {
      display: block; width: 100%; height: 100%; margin: 0; padding: 0; border: 0;
      background: #1F1F20; touch-action: none; outline: none;
    }
    #loading {
      position: absolute; inset: 0; display: grid; place-content: center; gap: 16px;
      text-align: center; color: #e8f3ff; font: 600 18px/1.4 system-ui, sans-serif;
      background: #06111f;
    }
    #track { width: min(72vw, 420px); height: 10px; overflow: hidden; border-radius: 6px; background: #18314a; }
    #progress { width: 0; height: 100%; background: linear-gradient(90deg,#36a8e0,#ffd43b); }
    #warning { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 4; }
  </style>
</head>
<body>
  <main id="safe-area">
    <div id="unity-container">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="loading"><div>Project Einstein</div><div id="track"><div id="progress"></div></div></div>
      <div id="warning"></div>
    </div>
  </main>
  <script src="Build/WebGLTest.loader.js"></script>
  <script>
    const canvas = document.querySelector('#unity-canvas');
    const loading = document.querySelector('#loading');
    const progress = document.querySelector('#progress');
    const warning = document.querySelector('#warning');
    const mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || navigator.maxTouchPoints > 1;

    function fitViewport() {
      const height = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      document.documentElement.style.height = height + 'px';
      document.body.style.height = height + 'px';
    }
    fitViewport();
    window.addEventListener('resize', fitViewport, { passive: true });
    window.addEventListener('orientationchange', () => setTimeout(fitViewport, 120), { passive: true });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', fitViewport, { passive: true });

    function showBanner(message, type) {
      const item = document.createElement('div');
      item.textContent = message;
      item.style.cssText = 'max-width:90vw;padding:10px 14px;border-radius:8px;color:#fff;background:' +
        (type === 'error' ? '#b42318' : '#8a6100');
      warning.appendChild(item);
      if (type !== 'error') setTimeout(() => item.remove(), 5000);
    }

    createUnityInstance(canvas, {
      arguments: [],
      dataUrl: 'Build/WebGLTest.data',
      frameworkUrl: 'Build/WebGLTest.framework.js',
      codeUrl: 'Build/WebGLTest.wasm',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: "Uchida Laboratory",
      productName: "ProjectEinstein",
      productVersion: "1.0 RC6",
      showBanner: showBanner,
      devicePixelRatio: mobile ? 1 : Math.min(window.devicePixelRatio || 1, 2),
      matchWebGLToCanvasSize: true
    }, value => progress.style.width = (value * 100) + '%').then(() => {
      loading.remove();
      canvas.focus();
      fitViewport();
    }).catch(message => showBanner(message, 'error'));
  </script>
</body>
</html>
